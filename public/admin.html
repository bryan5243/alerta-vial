<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alerta Vial · Administración EMOVTT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/img/emovtt-logo.png">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="/css/app.css">
<style>
  /* Login */
  .login{min-height:100dvh;display:grid;place-items:center;padding:20px;background:linear-gradient(150deg,var(--brand-dark),var(--brand) 55%,#1E3AA8)} .login .card{border-top:4px solid var(--brand-yellow)} .login h1{text-align:center} .login p.muted{text-align:center}
  .login .card{width:100%;max-width:400px;padding:28px;box-shadow:var(--shadow-2)}
  .login .logo{width:48px;height:48px;border-radius:14px;background:var(--ink);display:grid;place-items:center;margin-bottom:16px}
  .login .logo svg{width:24px;height:24px;stroke:#fff}
  /* Shell */
  .app{display:grid;grid-template-columns:220px 1fr;height:100dvh}
  nav.side{background:linear-gradient(180deg,var(--brand-dark),var(--brand));border-right:3px solid var(--brand-yellow);color:#fff;display:flex;flex-direction:column;padding:16px 12px}
  nav.side .brand{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:6px 10px 18px;font-family:var(--font-display);font-weight:800;letter-spacing:.6px} nav.side .brand img{height:40px;width:auto}
  nav.side .brand small{display:block;font:500 .72rem var(--font-body);opacity:.6;letter-spacing:.3px}
  .navbtn{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:10px 12px;border-radius:12px;border:0;background:none;color:rgb(255 255 255/.75);font-weight:500;cursor:pointer;text-align:left;transition:background .15s}
  .navbtn:hover{background:rgb(255 255 255/.08);color:#fff} .navbtn.on{background:rgb(255 255 255/.14);color:#fff}
  .navbtn .short{display:none} .navbtn .n{margin-left:auto;background:var(--brand-yellow);color:var(--brand-dark)!important;color:#fff;border-radius:999px;padding:0 7px;font-size:.72rem;font-weight:700}
  nav.side .spacer{flex:1}
  .content{display:grid;grid-template-rows:auto 1fr;min-height:0}
  .topbar{display:flex;align-items:center;gap:12px;padding:14px 24px;background:var(--surface);border-bottom:1px solid var(--line)}
  .topbar .spacer{flex:1}
  .work{display:grid;grid-template-columns:420px 1fr;min-height:0}
  .work.nomap{grid-template-columns:1fr}
  .col{overflow:auto;padding:20px 24px;display:flex;flex-direction:column;gap:16px} .col>*{flex:none}
  .work.nomap .col{max-width:860px}
  .mapcol{position:relative;background:#dfe8ee} #map{position:absolute;inset:0}
  .draw-tools{position:absolute;top:14px;left:14px;z-index:500;display:flex;gap:8px;flex-wrap:wrap}
  .draw-tools .btn{background:var(--surface);color:var(--ink);border-color:var(--line);box-shadow:var(--shadow-1)} .draw-tools .btn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .draw-hint{position:absolute;bottom:14px;left:14px;max-width:min(60%,420px);z-index:500;background:var(--ink);color:#fff;padding:8px 14px;border-radius:10px;font-size:.85rem;display:none}
  .draw-hint.on{display:block}
  .seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:4px;gap:4px}
  .seg button{min-height:38px;padding:6px 14px;border-radius:9px;border:0;background:none;font-weight:600;color:var(--muted);cursor:pointer}
  .seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow-1)}
  .lvl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .lvl-opt{border:1.5px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;background:var(--surface);font-weight:600;font-size:.85rem;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:44px}
  .lvl-opt .dot{width:14px;height:14px} .lvl-opt.on{border-color:var(--ink);box-shadow:0 0 0 3px var(--surface-2)}
  .item .acts{margin-left:auto;display:flex;gap:4px;flex:none}
  .item .acts .btn{width:36px;min-height:36px;padding:0;border-radius:9px}
  .section-head{display:flex;align-items:center;gap:10px}
  .section-head .btn{margin-left:auto}
  .drop{display:flex;align-items:center;justify-content:center;gap:10px;min-height:96px;padding:16px;border:1.5px dashed #b9c7d4;border-radius:14px;background:var(--surface-2);cursor:pointer;text-align:center;color:var(--muted);transition:border-color .15s,background .15s}
  .drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
  .drop svg.i{width:24px;height:24px}
  .switch{align-items:flex-start;line-height:1.4} .switch input{margin-top:0}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:.85rem} .kv b{color:var(--muted);font-weight:500}
  @media (max-width:900px){
    .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
    nav.side{order:2;flex-direction:row;overflow-x:auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:2px;position:sticky;bottom:0}
    nav.side{border-right:0;border-top:3px solid var(--brand-yellow)} a.navbtn{text-decoration:none}
    nav.side .brand,nav.side .spacer{display:none} .navbtn{flex-direction:column;gap:4px;min-width:64px;padding:8px 6px;font-size:.65rem;justify-content:center;white-space:nowrap} .navbtn .long{display:none} .navbtn .short{display:inline}
    .navbtn .n{position:absolute;margin:0;transform:translate(14px,-16px)}
    .navbtn{position:relative}
    .work{grid-template-columns:1fr;grid-template-rows:1fr 42dvh} .work.nomap{grid-template-rows:1fr} .mapcol{order:-1} .col{padding:16px}
    .lvl-grid{grid-template-columns:repeat(2,1fr)} .topbar{padding:10px 16px;gap:8px}
    .topbar h2{font-size:1.1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
    .topbar .chip{white-space:nowrap;flex:none} .topbar .spacer{flex:1 0 0;min-width:0}
    #top-weather{font-size:.72rem;line-height:1.25;text-align:right;min-width:0;max-width:46%;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  }
  @media (max-width:520px){ #top-weather{display:none} }
  /* Celular en horizontal: formulario y mapa lado a lado (si no, el mapa queda de 100 px) */
  @media (max-width:900px) and (max-height:560px) and (orientation:landscape){
    .work{grid-template-columns:minmax(280px,44%) 1fr;grid-template-rows:1fr} .work.nomap{grid-template-columns:1fr} .mapcol{order:0}
    .navbtn{min-width:58px;padding:5px 6px;gap:2px} .topbar{padding:6px 16px}
  }
  .osm-card{border-color:#BBDDF6;background:linear-gradient(180deg,#F2F8FE,var(--surface))}
  .osm-card h3{display:flex;align-items:center;gap:8px} .osm-card h3 svg{color:#1E88E5}
  .osm-list{margin-top:14px;display:grid;gap:6px;max-height:300px;overflow:auto;padding-right:4px}
  .osm-row{display:flex;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer}
  .osm-row:has(input:checked){border-color:#1E88E5;background:#EEF6FE}
  .osm-row.dup{opacity:.55;cursor:default}
  .osm-row b{display:block;font-size:.92rem} .osm-row small{color:var(--muted);font-size:.78rem}
  .osm-row input{width:18px;height:18px;flex:none;accent-color:#1E88E5}
  .osm-sw{flex:none;width:22px;height:6px;border-radius:3px;background:#2BA3E0} .osm-sw.stream{background:#7FB8DE;height:4px} .osm-sw.canal{background:#0A6DAE}
  details.manual summary{cursor:pointer;list-style:none;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap} details.manual summary::-webkit-details-marker{display:none}
  details.manual summary::before{content:'+';font-weight:700;color:var(--accent);width:14px} details.manual[open] summary::before{content:'–'}
  .rv-status{min-height:30px;padding:2px 8px;border-radius:8px;border:1px solid var(--line);font:inherit;font-size:.8rem;background:var(--surface);margin-right:4px}
  .lvlmsg label{display:flex;align-items:center;gap:8px;flex-wrap:wrap} .lvlmsg.cur textarea{border-color:var(--accent)}
  .feat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
  .feat{position:relative;display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;background:var(--surface-2);transition:background .2s,border-color .2s}
  .feat.on{background:var(--surface);border-color:var(--accent)}
  .feat input{position:absolute;opacity:0;pointer-events:none}
  .feat .tg{flex:none;width:38px;height:22px;border-radius:999px;background:#C5CED8;position:relative;transition:background .2s;margin-top:2px}
  .feat .tg::after{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0/.25);transition:transform .2s}
  .feat.on .tg{background:var(--accent)} .feat.on .tg::after{transform:translateX(16px)}
  .feat input:focus-visible + .tg{outline:2px solid var(--accent);outline-offset:2px}
  .feat b{display:block;font-size:.9rem} .feat small{display:block;color:var(--muted);font-size:.76rem;line-height:1.3;margin-top:2px}
  .feat:not(.on) b{color:var(--muted)}
  .pt-row{align-items:flex-start} .pt-row.on{border-color:var(--roja);background:#FFF6F5}
  .pt-row .meta svg.i{width:14px;height:14px;vertical-align:-2px}
  .pt-switch{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative;padding-top:2px}
  .pt-switch input{position:absolute;opacity:0;pointer-events:none}
  .pt-switch .tg{width:44px;height:26px;border-radius:999px;background:#C5CED8;position:relative;transition:background .2s}
  .pt-switch .tg::after{content:'';position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0/.25);transition:transform .2s}
  .pt-switch input:checked + .tg{background:var(--roja)} .pt-switch input:checked + .tg::after{transform:translateX(18px)}
  .pt-switch input:focus-visible + .tg{outline:2px solid var(--accent);outline-offset:2px}
  .pt-switch small{font-size:.7rem;font-weight:600;color:var(--muted)} .pt-row.on .pt-switch small{color:var(--roja)}
  .bulk{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 8px} .bulk .btn{min-height:34px;font-size:.8rem}
  .auto-card{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-color:#BBD3F0;background:linear-gradient(180deg,#F2F7FE,var(--surface))}
  .auto-card b{display:flex;gap:8px;align-items:center} .auto-card small{display:block;color:var(--muted);font-size:.8rem;margin-top:4px;max-width:52ch}
  .pt-acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.sim-card.on{border:2px solid var(--naranja)} .sim-card h3{display:flex;gap:8px;align-items:center} .sim-card h3 svg{width:20px;height:20px;color:var(--accent)}
  .sim-presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px} .sim-presets .btn.on{background:var(--accent);color:#fff;border-color:transparent}
  .sim-adv summary{cursor:pointer;font-weight:600;font-size:.85rem;margin:4px 0 10px;color:var(--accent)}
  .sim-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 12px}
  .sim-foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px} .sim-foot select{width:auto}
  .sim-res{margin-top:12px;font-size:.88rem;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.navsim-help h3{display:flex;gap:8px;align-items:center} .navsim-help h3 svg{width:20px;height:20px;color:#7A3FC4}
  .navsim-steps{margin:10px 0 10px 20px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
  .navsim-view{margin-top:12px;max-width:380px}
  .navsim-frame{border-radius:28px;overflow:hidden;background:#111;box-shadow:0 18px 48px rgb(15 34 56/.25);margin:0 auto;transition:width .35s var(--ease),border-width .35s}
  .navsim-frame.phone{width:390px;max-width:100%;height:780px;border:10px solid #111}
  .navsim-frame.wide{width:100%;height:calc(100dvh - 140px);min-height:560px;border:0;border-radius:16px}
  .navsim-frame iframe{width:100%;height:100%;border:0;display:block;background:#fff}
  .work.nomap .col:has(.navsim-frame.wide){max-width:none}
.obs-opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .obs-opt{display:flex;flex-direction:column;gap:2px;align-items:flex-start;text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);cursor:pointer;font:inherit;color:var(--ink);min-height:56px}
  .obs-opt small{color:var(--muted);font-size:.74rem;line-height:1.25} .obs-opt:hover{border-color:var(--accent)} .obs-opt.on{border-color:var(--naranja);background:var(--naranja-soft)}
  .obs-card.on{border-color:#F3C9A6}
  @media (max-width:600px){ .obs-opts{grid-template-columns:repeat(2,1fr)} }
  .src-list{display:flex;flex-direction:column;gap:8px}
  .src-row{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px} .src-row>div{flex:1;min-width:0}
  .src-row>i{width:10px;height:10px;border-radius:50%;flex:none;margin-top:6px;background:var(--normal)} .src-row.mid>i{background:var(--amarilla)} .src-row.hi>i{background:var(--roja)} .src-row.err>i{background:#B6BFCC} .src-row.off>i{background:transparent;border:2px solid #B6BFCC}
  .src-row.top{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)} .src-row small{color:var(--muted)} .src-row code{display:block;margin-top:4px;font-size:.72rem;background:var(--surface-2);padding:4px 6px;border-radius:6px;overflow-wrap:anywhere}
  .src-row details summary{cursor:pointer;color:var(--accent);margin-top:4px}
  .share-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
  .share-qr{width:148px;height:148px;flex:none;background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px} .share-qr svg{width:100%;height:100%;display:block}
  .share-acts{flex:1;min-width:220px;display:flex;flex-direction:column;gap:10px} .share-acts a.btn{text-decoration:none} .share-acts input{font-family:ui-monospace,monospace;font-size:.85rem}
</style>
</head>
<body>
<div id="root"></div>
<script src="/vendor/leaflet/leaflet.js"></script>
<script src="/vendor/parsers/jszip.min.js"></script>
<script src="/vendor/parsers/shp.min.js"></script>
<script src="/vendor/qrcode/qrcode.js"></script>
<script type="module" src="/js/admin.js"></script>
</body>
</html>
